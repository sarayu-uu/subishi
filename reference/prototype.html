<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Subishi Project Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: a full-bleed map is the page; a slim brand bar + filter row float on top; a draggable sheet rises from the bottom (left panel from 900px). */
:root{
  --land:#F3EEE5; --paper:#FCFAF6; --ink:#1C2230; --muted:#5E6575; --faint:#8A8F9B;
  --line:#E2DACB; --road:#FFFFFF; --road-edge:#E0D6C4; --water:#CFDCE3; --park:#E1E8D6;
  --brand:#3B4C9A; --brand-ink:#FFFFFF; --brand-soft:#E8EBF5;
  --ready:#2E7D5B; --building:#B9853A; --soon:#3B4C9A; --done:#8C919C;
  --shadow:0 1px 2px rgba(28,34,48,.10),0 6px 18px rgba(28,34,48,.12);
  --display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-sm:10px; --r-md:14px; --r-lg:22px;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:var(--land);color:var(--ink);font:15px/1.45 var(--ui);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.app{position:relative;height:100%;overflow:hidden}

/* ---------- map ---------- */
#map{position:absolute;inset:0;touch-action:none;cursor:grab;background:var(--land);overflow:hidden}
#map.dragging{cursor:grabbing}
#base{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#base svg{display:block;overflow:visible}
.w{fill:var(--water)} .wd{fill:var(--park);opacity:.9} .gr{fill:var(--park)} .air{fill:#E6E1D8}
.rd{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.sec{stroke:var(--road);stroke-width:1.4} .pri{stroke:var(--road);stroke-width:2.2} .pri-e{stroke:var(--road-edge);stroke-width:3.6}
.trk{stroke:var(--road);stroke-width:2.8} .trk-e{stroke:var(--road-edge);stroke-width:4.4}
.mwy{stroke:var(--brand);stroke-width:2.2;opacity:.55} .rail{stroke:#CFC6B6;stroke-width:1;stroke-dasharray:3 3}
#labels,#pins{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:11px;letter-spacing:.02em;color:var(--muted);text-shadow:0 0 3px var(--land),0 0 3px var(--land),0 0 6px var(--land)}
.lbl.lm{font-weight:600;color:#4B5263;font-size:11.5px}
.lbl.loc{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint)}
.lbl.orr{font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--brand);background:var(--paper);padding:1px 5px;border-radius:5px;text-shadow:none;box-shadow:0 0 0 1px rgba(59,76,154,.25)}
.lbl .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#7C8394;margin-right:5px;vertical-align:1px}
.lbl.near{color:var(--ink);font-weight:600}
.lbl.near .dot{background:var(--brand)}

.pin{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);width:44px;height:44px;display:grid;place-items:center;transition:transform .18s ease}
.pin .b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c);box-shadow:0 0 0 2.5px #fff,0 3px 10px rgba(28,34,48,.28);transition:width .18s,height .18s,box-shadow .18s}
.pin svg{width:17px;height:17px;fill:#fff}
.pin.done .b{width:24px;height:24px;box-shadow:0 0 0 2px #fff,0 1px 4px rgba(28,34,48,.18);opacity:.85}
.pin.done svg{width:12px;height:12px}
.pin.soon .b{background:#fff;box-shadow:0 0 0 2px var(--soon),0 3px 10px rgba(28,34,48,.2)}
.pin.soon svg{fill:var(--soon)}
.pin.sel{z-index:5}
.pin.sel .b{width:44px;height:44px;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--brand),0 6px 16px rgba(28,34,48,.3)}
.pin.sel.done .b{opacity:1}
.pin.sel svg{width:21px;height:21px}
.pin .tag{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;white-space:nowrap;box-shadow:var(--shadow)}
.pin .tag::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink)}
.cl{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);width:48px;height:48px;display:grid;place-items:center}
.cl .b{min-width:36px;height:36px;padding:0 8px;border-radius:18px;background:var(--paper);color:var(--ink);font-weight:700;font-size:14px;display:flex;align-items:center;gap:4px;box-shadow:0 0 0 2px var(--c),0 3px 10px rgba(28,34,48,.22)}
.cl .b i{width:8px;height:8px;border-radius:50%;background:var(--c)}
@media (hover:hover){.pin:hover .b,.cl:hover .b{transform:scale(1.08)}}

/* ---------- top ---------- */
.top{position:absolute;left:0;right:0;top:0;z-index:20;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none;display:grid;gap:8px}
.bar{pointer-events:auto;display:flex;align-items:center;gap:10px;height:48px;padding:0 6px 0 16px;background:var(--paper);border-radius:var(--r-md);box-shadow:var(--shadow)}
.mark{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.24em;color:var(--brand);line-height:1}
.mark small{display:block;font:600 9px/1 var(--ui);letter-spacing:.2em;color:var(--faint);margin-top:3px;text-transform:uppercase}
.bar .sp{flex:1}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.ibtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{background:var(--brand-soft)}
.search{flex:1;min-width:0;height:40px;border:0;background:transparent;font:500 15px var(--ui);color:var(--ink);outline:none}
.search::placeholder{color:var(--faint)}
.chips{pointer-events:auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 12px;border-radius:17px;background:var(--paper);box-shadow:0 1px 2px rgba(28,34,48,.1),0 2px 8px rgba(28,34,48,.08);display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.chip .n{font-variant-numeric:tabular-nums;color:var(--faint);font-weight:600}
.chip[aria-pressed="true"]{color:var(--ink)}
.chip[aria-pressed="false"]{background:rgba(252,250,246,.72);color:var(--faint)}
.chip[aria-pressed="false"] i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.seg{flex:none;display:flex;height:34px;padding:3px;border-radius:17px;background:var(--paper);box-shadow:0 1px 2px rgba(28,34,48,.1),0 2px 8px rgba(28,34,48,.08)}
.seg button{padding:0 11px;border-radius:14px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.edge{pointer-events:auto;justify-self:center;display:none;align-items:center;gap:8px;height:32px;padding:0 12px 0 8px;border-radius:16px;background:var(--paper);box-shadow:var(--shadow);font-size:12.5px;font-weight:600;color:var(--ink)}
.edge.on{display:flex}
.edge .b{width:20px;height:20px;border-radius:50%;background:var(--building);display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.edge .b svg{width:11px;height:11px;fill:#fff}
.edge em{font-style:normal;color:var(--faint);font-weight:500}

.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));z-index:15;display:grid;gap:1px;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);bottom:calc(var(--peek,190px) + 14px);transition:bottom .25s}
.zoom button{width:40px;height:40px;background:var(--paper);display:grid;place-items:center}
.zoom svg{width:18px;height:18px;stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linecap:round}

/* ---------- sheet ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:30;height:calc(100% - env(safe-area-inset-top,0px) - 12px);background:var(--paper);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -2px 24px rgba(28,34,48,.16);display:flex;flex-direction:column;transform:translateY(calc(100% - var(--peek,190px)));will-change:transform}
.sheet.anim{transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.grab{flex:none;height:26px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab::before{content:"";width:40px;height:4.5px;border-radius:3px;background:#D5CCBC}
.scroller{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.sheet.lock .scroller{overflow:hidden}
.sheet.lock .acts{display:none}
.h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.h h2{font:600 24px/1.1 var(--display);margin:0;letter-spacing:.005em}
.h span{font-size:12.5px;color:var(--faint);font-weight:500}
.zones{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 14px;padding:0 18px}
.zones::-webkit-scrollbar{display:none}
.zone{flex:none;height:32px;padding:0 13px;border-radius:16px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink);background:transparent}
.zone:active{background:var(--brand-soft)}
.list{display:grid;gap:2px}
.group-t{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.group-t i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:8px;margin:0 -8px;border-radius:12px;text-align:left;width:calc(100% + 16px)}
.row:active{background:#F2EEE6}
@media (hover:hover){.row:hover{background:#F5F1EA}}
.row img,.row .ph{width:64px;height:46px;border-radius:9px;object-fit:cover;background:var(--line)}
.row b{display:block;font:600 18px/1.15 var(--display)}
.row small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{font-size:12.5px;font-weight:700;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .rt em{display:block;font-style:normal;font-weight:500;color:var(--faint);font-size:11px}
.row .mid{min-width:0}
.empty{padding:22px 0;color:var(--muted);text-align:center}
.empty button{color:var(--brand);font-weight:700;margin-top:6px}

/* card */
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--muted);height:32px;margin-bottom:6px}
.back svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none}
.hero{position:relative;border-radius:var(--r-md);overflow:hidden;aspect-ratio:16/10;max-width:100%;background:var(--line)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .soonart{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(120% 90% at 30% 20%,#56649F 0%,#2D3A78 60%,#222C5E 100%);color:#fff;text-align:center}
.hero .soonart b{font:600 30px/1 var(--display);letter-spacing:.06em}
.hero .soonart span{display:block;font-size:11px;letter-spacing:.24em;text-transform:uppercase;opacity:.75;margin-top:8px}
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:700;color:#fff;background:var(--c)}
.badge.soon{background:#fff;color:var(--soon);box-shadow:inset 0 0 0 1.5px var(--soon)}
.hero .badge{position:absolute;left:10px;top:10px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.title{margin:14px 0 2px;font:600 32px/1.05 var(--display);letter-spacing:.005em;text-wrap:balance}
.where{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.where svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.one{margin:12px 0 0;font-size:16px;font-weight:600}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:var(--r-sm);overflow:hidden;margin-top:14px}
.facts div{background:var(--paper);padding:10px 12px;min-width:0}
.facts dt{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.facts dd{margin:2px 0 0;font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums}
.facts dd small{display:block;font-size:11.5px;font-weight:500;color:var(--faint)}
.facts .wide{grid-column:1/-1}
.price b{font-size:18px}
.drive{margin-top:16px}
.drive h3,.hl h3{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
.drive ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.drive li{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.drive li span:last-child{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.drive p{margin:6px 0 0;font-size:11.5px;color:var(--faint)}
.hl{margin-top:16px}
.hl div{display:flex;flex-wrap:wrap;gap:6px}
.hl span{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:12px;background:#F1ECE3;color:#4A4F5C}
.trust{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.trust svg{width:15px;height:15px;stroke:var(--ready);fill:none;stroke-width:2;flex:none}
.acts{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));z-index:2;margin:18px -18px 0;padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(rgba(252,250,246,0),var(--paper) 22%);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14.5px;text-decoration:none;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;grid-column:1/-1}
.btn:active{transform:scale(.98)}
.call{grid-column:1/-1;text-align:center;font-size:12.5px;color:var(--muted)}
.call b{color:var(--ink);user-select:all}
.src{margin-top:4px;font-size:11px;color:var(--faint)}
.src a{color:var(--faint)}
.note{margin-top:10px;font-size:13px;color:var(--muted)}

@media (min-width:900px){
  .sheet{left:max(16px,env(safe-area-inset-left,0px));right:auto;top:16px;bottom:16px;width:392px;height:auto;border-radius:var(--r-lg);transform:none!important;box-shadow:var(--shadow)}
  .grab{display:none}
  .scroller{padding:20px 22px 24px}
  .zones{margin:0 -22px 14px;padding:0 22px}
  .acts{margin:18px -22px 0;padding:12px 22px 14px;bottom:-24px}
  .top{left:424px;padding-top:16px;padding-right:16px}
  .bar{max-width:520px}
  .zoom{bottom:24px!important;right:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const ICON = {villa:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 2.5 10.6l1.2 1.5 1.3-1V20h5.2v-5.2h3.6V20H19v-8.9l1.3 1 1.2-1.5z"/></svg>`, building:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9v6h3v12h-5v-4h-2v4H6zm2.5 3v2h1.6V6zm3.4 0v2h1.6V6zm-3.4 3.6v2h1.6v-2zm3.4 0v2h1.6v-2zm-3.4 3.6v2h1.6v-2zm3.4 0v2h1.6v-2zm4.6-.6v1.8h1.6v-1.8zm0 3.2v1.8h1.6v-1.8z"/></svg>`};
const ST = Object.fromEntries(DATA.statuses.map(s=>[s.id,s]));
const P = DATA.projects;
const $ = s=>document.querySelector(s);
const mapEl=$('#map'), base=$('#base'), pinsEl=$('#pins'), labelsEl=$('#labels'), sheet=$('#sheet'), scroller=$('#scroller');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wide = ()=>innerWidth>=900;

/* ---------- state ---------- */
const state={status:Object.fromEntries(DATA.statuses.map(s=>[s.id,s.visibleByDefault])),type:'all',sel:null,q:'',searching:false};
const visible = p => state.status[p.status] && (state.type==='all' || (state.type==='villa'? p.type==='villa' : p.type!=='villa')) && (!state.q || (p.name+' '+p.location.locality).toLowerCase().includes(state.q));

/* ---------- view transform ---------- */
let V={s:1,x:0,y:0};
const MW=DATA.map.w, MH=DATA.map.h;
function apply(){ base.style.transform=`translate(${V.x}px,${V.y}px) scale(${V.s})`; drawOverlay(); }
function clampV(){ const r=mapEl.getBoundingClientRect(); const minS=Math.min(r.width/MW,r.height/MH)*0.85; V.s=Math.min(7,Math.max(minS,V.s));
  const px=r.width*0.6, py=r.height*0.6; V.x=Math.min(px,Math.max(r.width-MW*V.s-px,V.x)); V.y=Math.min(py,Math.max(r.height-MH*V.s-py,V.y)); }
function viewBox(){ // usable area not covered by sheet / top
  const r=mapEl.getBoundingClientRect();
  if(wide()) return {l:424,t:80,r:r.width-20,b:r.height-20};
  return {l:16,t:150,r:r.width-16,b:r.height-sheetVisible()-16};
}
function fit(pts,maxS=6,anim=true){
  const vb=viewBox(); vb.l+=34; vb.r-=34; vb.t+=48; vb.b-=30; let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  pts.forEach(p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y)});
  const w=Math.max(x1-x0,1),h=Math.max(y1-y0,1);
  let s=Math.min((vb.r-vb.l)/w,(vb.b-vb.t)/h,maxS);
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  flyTo({s, x:(vb.l+vb.r)/2-cx*s, y:(vb.t+vb.b)/2-cy*s}, anim);
}
let anim=null;
function flyTo(T,animate=true){
  cancelAnimationFrame(anim);
  if(reduce||!animate){V=T;clampV();apply();return}
  const F={...V}, t0=performance.now(), d=520;
  const step=t=>{let k=Math.min(1,(t-t0)/d); k=1-Math.pow(1-k,3);
    // interpolate in log scale for zoom
    const s=Math.exp(Math.log(F.s)+(Math.log(T.s)-Math.log(F.s))*k);
    const cxF=(innerWidth/2-F.x)/F.s, cyF=(innerHeight/2-F.y)/F.s, cxT=(innerWidth/2-T.x)/T.s, cyT=(innerHeight/2-T.y)/T.s;
    const cx=cxF+(cxT-cxF)*k, cy=cyF+(cyT-cyF)*k;
    V={s,x:innerWidth/2-cx*s,y:innerHeight/2-cy*s}; apply();
    if(k<1) anim=requestAnimationFrame(step); else {V=T;clampV();apply()} };
  anim=requestAnimationFrame(step);
}
function zoomAt(f,px,py){ const s=Math.min(7,V.s*f); const k=s/V.s; V.x=px-(px-V.x)*k; V.y=py-(py-V.y)*k; V.s=s; clampV(); apply(); }

/* ---------- gestures ---------- */
const pts=new Map(); let last=null, moved=0, lastTap=0;
mapEl.addEventListener('pointerdown',e=>{ if(e.target.closest('.pin,.cl')) return; mapEl.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0; last=null; mapEl.classList.add('dragging'); cancelAnimationFrame(anim); });
mapEl.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const a=[...pts.values()];
  if(a.length===1){ if(last&&last.n===1){ V.x+=a[0].x-last.x; V.y+=a[0].y-last.y; moved+=Math.abs(a[0].x-last.x)+Math.abs(a[0].y-last.y); clampV(); apply(); } last={n:1,x:a[0].x,y:a[0].y}; }
  else { const cx=(a[0].x+a[1].x)/2, cy=(a[0].y+a[1].y)/2, d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(last&&last.n===2){ V.x+=cx-last.x; V.y+=cy-last.y; zoomAt(d/last.d,cx,cy); } last={n:2,x:cx,y:cy,d}; moved+=10; }
});
const up=e=>{ if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId); last=null; if(!pts.size){ mapEl.classList.remove('dragging');
    if(moved<6 && e.type==='pointerup'){ const now=performance.now(); if(now-lastTap<300){ zoomAt(2,e.clientX,e.clientY); lastTap=0;} else { lastTap=now; if(state.sel===null && !wide()) snap('peek'); } } } };
mapEl.addEventListener('pointerup',up); mapEl.addEventListener('pointercancel',up);
mapEl.addEventListener('wheel',e=>{e.preventDefault(); zoomAt(Math.exp(-e.deltaY*0.0022),e.clientX,e.clientY)},{passive:false});
$('#zin').onclick=()=>{const r=mapEl.getBoundingClientRect(); zoomAt(1.6,r.width/2,r.height/2)};
$('#zout').onclick=()=>{const r=mapEl.getBoundingClientRect(); zoomAt(1/1.6,r.width/2,r.height/2)};

/* ---------- overlay: labels + pins + clusters ---------- */
const scr=p=>({x:p.x*V.s+V.x, y:p.y*V.s+V.y});
function drawOverlay(){
  // labels
  let lh='';
  const near = state.sel ? new Set(P.find(p=>p.id===state.sel)?.nearbyIds||[]) : new Set();
  DATA.labels.forEach(l=>{
    if(l.kind==='loc' && V.s<1.5) return;
    if(l.kind==='lm' && l.tier!=='always' && !near.has(l.id)) return;
    const q=scr(l); lh+=`<div class="lbl ${l.kind}${near.has(l.id)?' near':''}" style="left:${q.x}px;top:${q.y}px">${l.kind==='lm'?'<span class="dot"></span>':''}${l.name}</div>`;
  });
  labelsEl.innerHTML=lh;
  // pins with clustering
  const vis=P.filter(p=>p.inMap && visible(p)).map(p=>({p,...scr(p)}));
  vis.sort((a,b)=>(a.p.id===state.sel)-(b.p.id===state.sel) || (b.p.status==='delivered')-(a.p.status==='delivered'));
  const clusters=[], R=V.s>4?0:38;
  vis.forEach(v=>{ if(v.p.id===state.sel){clusters.push({m:[v],x:v.x,y:v.y});return}
    const c=clusters.find(c=>c.m[0].p.id!==state.sel && Math.hypot(c.x-v.x,c.y-v.y)<R); if(c){c.m.push(v)} else clusters.push({m:[v],x:v.x,y:v.y}) });
  let h='';
  clusters.forEach((c,i)=>{
    if(c.m.length===1){ const p=c.m[0].p, s=ST[p.status];
      const cls=p.status==='delivered'?' done':p.status==='upcoming'?' soon':'';
      h+=`<button class="pin${cls}${p.id===state.sel?' sel':''}" style="left:${c.x}px;top:${c.y}px;--c:${s.color}" data-id="${p.id}" aria-label="${p.name}, ${s.label}"><span class="b">${ICON[p.type==='villa'?'villa':'building']}</span>${p.id===state.sel?`<span class="tag">${p.name}</span>`:''}</button>`;
    } else { const order=['ready','under-construction','upcoming','delivered']; const top=c.m.map(m=>m.p.status).sort((a,b)=>order.indexOf(a)-order.indexOf(b))[0];
      const cx=c.m.reduce((a,m)=>a+m.x,0)/c.m.length, cy=c.m.reduce((a,m)=>a+m.y,0)/c.m.length;
      h+=`<button class="cl" style="left:${cx}px;top:${cy}px;--c:${ST[top].color}" data-c="${c.m.map(m=>m.p.id).join(',')}" aria-label="${c.m.length} projects here, zoom in"><span class="b"><i></i>${c.m.length}</span></button>`; }
  });
  pinsEl.innerHTML=h;
  // Kamareddy edge marker
  const k=P.find(p=>!p.inMap); $('#edge').classList.toggle('on', !!k && visible(k) && !state.searching);
}
pinsEl.addEventListener('click',e=>{ const b=e.target.closest('.pin,.cl'); if(!b) return;
  if(b.dataset.id) select(b.dataset.id);
  else { const ids=b.dataset.c.split(','); fit(P.filter(p=>ids.includes(p.id)),Math.max(V.s*2.2,3)); }
});
$('#edge').onclick=()=>select(P.find(p=>!p.inMap).id);

/* ---------- filters ---------- */
function drawChips(){
  const counts=id=>P.filter(p=>p.status===id).length;
  let h=DATA.statuses.map(s=>`<button class="chip" style="--c:${s.color}" aria-pressed="${state.status[s.id]}" data-s="${s.id}"><i></i>${s.short}<span class="n">${counts(s.id)}</span></button>`).join('');
  h+=`<div class="seg" role="group" aria-label="Home type">${[['all','All'],['villa','Villas'],['apt','Apartments']].map(([k,l])=>`<button aria-pressed="${state.type===k}" data-t="${k}">${l}</button>`).join('')}</div>`;
  $('#chips').innerHTML=h;
}
$('#chips').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.s){ state.status[b.dataset.s]=!state.status[b.dataset.s]; }
  if(b.dataset.t){ state.type=b.dataset.t; }
  drawChips(); drawOverlay(); if(state.sel===null) drawList();
});

/* ---------- search ---------- */
$('#sbtn').onclick=()=>{
  state.searching=!state.searching;
  const bar=$('#bar');
  if(state.searching){ $('#markwrap').hidden=true; bar.querySelector('.sp').hidden=true;
    bar.insertAdjacentHTML('afterbegin','<input id="q" class="search" type="search" placeholder="Search a project or area" aria-label="Search a project or area" autocomplete="off">');
    $('#sbtn').innerHTML='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'; $('#sbtn').setAttribute('aria-label','Close search');
    const q=$('#q'); q.focus(); q.oninput=()=>{state.q=q.value.trim().toLowerCase(); drawOverlay(); state.sel=null; drawList(); snap('half')};
  } else { $('#q')?.remove(); $('#markwrap').hidden=false; bar.querySelector('.sp').hidden=false; state.q='';
    $('#sbtn').innerHTML='<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>'; $('#sbtn').setAttribute('aria-label','Search projects'); drawOverlay(); drawList(); }
};

/* ---------- formatting ---------- */
const nf=n=>n.toLocaleString('en-IN');
const range=(a,u)=>!a||!a.length?'':(a.length>1&&a[0]!==a[1]?`${nf(a[0])}–${nf(a[1])}`:nf(a[0]))+u;
const bhk=c=>!c.length?'':c.map(x=>x.replace(' BHK','')).join(' & ')+' BHK';
const typeName=t=>({villa:'Villas',apartment:'Apartments',mixed:'Homes + shops'})[t];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const poss=p=>!p.possession?'':p.possession==='ready'?'Ready to move':`Possession ${MON[+p.possession.slice(5)-1]} ${p.possession.slice(0,4)}`;
const statusLine=p=>p.status==='under-construction'&&p.possession&&p.possession!=='ready'?`Under construction · ${poss(p)}`:ST[p.status].label;
const oneLine=p=>[ [bhk(p.config),typeName(p.type)].filter(Boolean).join(' '), range(p.sizes.builtUpSft,' sft') ].filter(Boolean).join(' · ');
const thumb=p=>DATA.img[p.id]?`<img src="${DATA.img[p.id]}" alt="" loading="lazy">`:`<span class="ph"></span>`;

/* ---------- list ---------- */
function drawList(){
  const vis=P.filter(visible);
  const groups=DATA.statuses.filter(s=>state.status[s.id]).map(s=>({s,items:vis.filter(p=>p.status===s.id).sort((a,b)=>a.order-b.order)})).filter(g=>g.items.length);
  let h=`<div class="h"><h2>${state.q?'Search results':'Subishi projects'}</h2><span>${vis.length} shown</span></div>`;
  if(!state.q) h+=`<div class="zones">${DATA.zones.map(z=>`<button class="zone" data-z="${z.id}">${z.label}</button>`).join('')}</div>`;
  if(!vis.length) h+=`<div class="empty">No projects match these filters.<br><button id="reset">Show all projects</button></div>`;
  groups.forEach(g=>{ h+=`<div class="group-t" style="--c:${g.s.color}"><i></i>${g.s.label}</div><div class="list">`;
    g.items.forEach(p=>{ const right = p.price&&p.price.from? `${p.price.label.replace('Starts from ','')}<em>onwards</em>` : p.status==='delivered'? `<em>Sold out</em>` : p.status==='upcoming'? `<em>Soon</em>` : `<em>On request</em>`;
      h+=`<button class="row" data-id="${p.id}">${thumb(p)}<span class="mid"><b>${p.name}</b><small>${p.location.locality} · ${oneLine(p)||typeName(p.type)}</small></span><span class="rt">${right}</span></button>`; });
    h+='</div>'; });
  scroller.innerHTML=h; scroller.scrollTop=0;
  $('#reset')?.addEventListener('click',()=>{DATA.statuses.forEach(s=>state.status[s.id]=true); state.type='all'; drawChips(); drawOverlay(); drawList();});
}
scroller.addEventListener('click',e=>{
  const r=e.target.closest('.row'); if(r) return select(r.dataset.id);
  const z=e.target.closest('.zone'); if(z){ const zone=DATA.zones.find(x=>x.id===z.dataset.z);
    if(zone.id==='kamareddy') return select(P.find(p=>!p.inMap).id);
    const ps=P.filter(p=>p.zone===zone.id&&p.inMap&&visible(p)); if(!wide()) snap('peek'); setTimeout(()=>fit(ps.length?ps:P.filter(p=>p.zone===zone.id&&p.inMap),4),wide()?0:200); }
  if(e.target.closest('.back')) deselect();
});

/* ---------- card ---------- */
function card(p){
  const s=ST[p.status], done=p.status==='delivered', soon=p.status==='upcoming';
  const L=p.links||{};
  let h=`<button class="back" type="button"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>All projects</button>`;
  h+=`<div class="hero">${DATA.img[p.id]?`<img src="${DATA.img[p.id]}" alt="${p.name}">`:`<div class="soonart"><div><b>${p.name.toUpperCase()}</b><span>Coming soon</span></div></div>`}<span class="badge${soon?' soon':''}" style="--c:${s.color}">${statusLine(p)}</span></div>`;
  h+=`<h2 class="title">${p.name}</h2><div class="where"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0113 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>${p.location.locality}${p.inMap?'':' · about 110 km from Hyderabad'}</div>`;
  if(p.tagline) h+=`<p class="one">${soon?p.tagline:oneLine(p)||p.tagline}</p>`;
  // facts grid
  const f=[];
  if(!done && !soon) f.push(p.price&&p.price.from?`<div class="wide price"><dt>Price</dt><dd><b>${p.price.label}</b><small>${p.price.range} · indicative, via <a href="${p.price.source.url}" target="_blank" rel="noopener">${p.price.source.name}</a></small></dd></div>`:`<div class="wide price"><dt>Price</dt><dd>On request<small>Call Subishi for current pricing</small></dd></div>`);
  if(p.scale.units) f.push(`<div><dt>Community</dt><dd>${nf(p.scale.units)} ${p.scale.unitLabel}${p.scale.acres?`<small>${p.scale.acres} acres</small>`:''}</dd></div>`);
  if(p.sizes.plotSqYd) f.push(`<div><dt>Plot</dt><dd>${p.sizes.plotSqYd.join(' & ')} sq yd</dd></div>`);
  else if(p.scale.floors) f.push(`<div><dt>Height</dt><dd>${p.scale.floors} floors</dd></div>`);
  if(p.status!=='under-construction' && poss(p) && !done) f.push(`<div><dt>Possession</dt><dd>${poss(p)}</dd></div>`);
  if(f.length%2===0 && f.length && f[0].includes('wide')) {}
  { const n=f.filter(x=>!x.includes('class="wide')).length; if(n%2){ const i=f.length-1; f[i]=f[i].replace('<div>','<div class="wide">'); } }
  if(f.length) h+=`<dl class="facts">${f.join('')}</dl>`;
  // drive times
  if(p.drive&&p.drive.length) h+=`<div class="drive"><h3>Drive times</h3><ul>${p.drive.map(d=>`<li><span>${d.name}</span><span>≈ ${d.t}</span></li>`).join('')}</ul><p>Estimated from distance; traffic varies.</p></div>`;
  if(p.highlights&&p.highlights.length) h+=`<div class="hl"><h3>${done?'About':'Highlights'}</h3><div>${p.highlights.map(x=>`<span>${x}</span>`).join('')}</div></div>`;
  if(done) h+=`<p class="note">Completed and handed over to ${p.scale.units?nf(p.scale.units)+' families':'its owners'}. Subishi built it; homes here sell only on resale.</p>`;
  if(p.approvals&&(p.approvals.rera||p.approvals.authority)) h+=`<div class="trust"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>${[p.approvals.rera?'RERA '+p.approvals.rera:'',p.approvals.authority?p.approvals.authority+' approved':''].filter(Boolean).join(' · ')}</div>`;
  // actions
  const a=[];
  if(L.video) a.push(`<a class="btn pri" href="${L.video}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/></svg>${soon?'Watch the reveal':p.status==='under-construction'?'Watch progress':'Watch video'}</a>`);
  if(L.website) a.push(`<a class="btn${L.video?'':' pri'}" href="${L.website}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/></svg>Visit site</a>`);
  if(L.brochure) a.push(`<a class="btn" href="${L.brochure}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>Brochure</a>`);
  if(!soon) a.push(`<a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=${p.location.lat},${p.location.lng}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0113 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>Directions</a>`);
  if(a.filter(x=>!x.includes('btn pri')).length%2) a.push(`<a class="btn" href="tel:${DATA.phone}"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a1 1 0 01-1 1A16 16 0 014 5a1 1 0 011-1z"/></svg>Call</a>`);
  if(!done) a.push(`<div class="call">Sales: <b>${DATA.phoneDisplay}</b></div>`);
  h+=`<div class="acts">${a.join('')}</div>`;
  if(p.meta&&p.price&&p.price.from) {}
  return h;
}
function select(id,opts={}){
  const p=P.find(x=>x.id===id); if(!p) return;
  if(state.searching) $('#sbtn').click();
  state.sel=id; scroller.innerHTML=card(p); scroller.scrollTop=0;
  if(!wide()) snap('half');
  drawOverlay();
  if(p.inMap){ const near=(p.nearbyPts||[]); const zoomS=Math.max(V.s,3.2);
    setTimeout(()=>fit([p,...near],Math.max(zoomS,1),!opts.instant),wide()||opts.instant?0:340); }
}
function deselect(){ state.sel=null; drawList(); drawOverlay(); if(!wide()) snap('peek'); }

/* ---------- sheet drag ---------- */
let sheetY=0;
function H(){ return sheet.getBoundingClientRect().height }
function sheetVisible(){ return wide()?0: H()-sheetY }
const SNAP=()=>{ const h=H(); return {peek:h-190, half:h-Math.round(innerHeight*0.56), full:0}; };
let cur='peek';
function fitScroller(){ if(wide()){ scroller.style.height=''; return; } scroller.style.flex='none'; scroller.style.height=Math.max(120,H()-sheetY-26)+'px'; }
function snap(name,animate=true){ if(wide()) return; cur=name; sheetY=SNAP()[name]; fitScroller(); sheet.classList.toggle('anim',animate); sheet.style.transform=`translateY(${sheetY}px)`; sheet.classList.toggle('lock',name==='peek');
  document.documentElement.style.setProperty('--peek',(name==='peek'?190:Math.round(innerHeight*0.56))+'px'); }
(()=>{ let y0=null,s0=0,t0=0,fromScroll=false;
  const start=(e,scrollable)=>{ if(wide()) return; if(scrollable && (scroller.scrollTop>0 && cur==='full')) return; y0=e.clientY; s0=sheetY; t0=performance.now(); fromScroll=scrollable; };
  const move=e=>{ if(y0===null) return; const dy=e.clientY-y0;
    if(fromScroll && cur==='full' && dy<0) { y0=null; return; }
    if(fromScroll && Math.abs(dy)<6) return;
    sheet.classList.remove('anim'); sheetY=Math.max(0,s0+dy); if(dy<0) fitScroller(); sheet.style.transform=`translateY(${sheetY}px)`; e.preventDefault(); };
  const end=e=>{ if(y0===null) return; const dy=e.clientY-y0, v=dy/Math.max(1,performance.now()-t0); y0=null; if(Math.abs(dy)<6 && !fromScroll){ snap(cur==='peek'?'half':cur==='half'?'full':'half'); return; }
    if(Math.abs(dy)<6) return;
    const S=SNAP(); let n;
    if(v>0.6) n= cur==='full'?'half':'peek'; else if(v<-0.6) n= cur==='peek'?'half':'full';
    else n=Object.entries(S).sort((a,b)=>Math.abs(a[1]-sheetY)-Math.abs(b[1]-sheetY))[0][0];
    if(n==='peek' && state.sel){ /* keep card readable: collapse to half instead of hiding */ }
    snap(n); };
  const g=$('#grab');
  g.addEventListener('pointerdown',e=>{g.setPointerCapture(e.pointerId); start(e,false)}); g.addEventListener('pointermove',move); g.addEventListener('pointerup',end); g.addEventListener('pointercancel',end);
  g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault(); snap(cur==='full'?'peek':cur==='half'?'full':'half')} });
  scroller.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse') return; start(e,true)});
  scroller.addEventListener('pointermove',e=>{ if(e.pointerType==='mouse') return; if(cur!=='full'||scroller.scrollTop<=0) move(e)},{passive:false});
  scroller.addEventListener('pointerup',end); scroller.addEventListener('pointercancel',()=>{y0=null});
  scroller.addEventListener('scroll',()=>{ if(cur!=='full' && y0===null && scroller.scrollTop>0 && !wide()) { snap('full'); } });
})();
addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(state.searching) $('#sbtn').click(); else if(state.sel) deselect(); } });

/* ---------- boot ---------- */
function home(animate){ fit(P.filter(p=>p.inMap),3.5,animate); }
function boot(){
  drawChips(); drawList(); snap('peek',false);
  const r=mapEl.getBoundingClientRect(); V.s=Math.max(r.width/MW,r.height/MH); apply();
  home(false);
  const h=(location.hash||'').slice(1); if(h && P.some(p=>p.id===h)) select(h,{instant:true});
}
let rt; addEventListener('resize',()=>{clearTimeout(rt); rt=setTimeout(()=>{ if(!wide()) snap(cur,false); else fitScroller(); clampV(); apply(); },120)});
boot();
</script>

</body></html>
