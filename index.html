<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F0E6" />
    <title>Subishi Projects Map</title>
    <meta name="description" content="Every Subishi villa and apartment community across Telangana on one map." />
    <!-- Link previews. scripts/make-share-pages.ts makes these absolute and writes one page per project. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Subishi" />
    <meta property="og:title" content="Homes by Subishi" />
    <meta property="og:description" content="Every Subishi villa and apartment community across Telangana on one map." />
    <meta property="og:image" content="https://subishi.vercel.app/og/default.jpg" />
    <meta property="og:url" content="https://subishi.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="prefetch" href="/data/index.json" />
    <style>
      /* Critical CSS: only what the splash needs before any script loads */
      html,body,#app{height:100%;margin:0;background:#F6F0E6;overflow:hidden}
      #splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#F6F0E6;transition:background-color .7s ease}
      #splash .logo{width:min(60vw,280px);transform-origin:0 0;will-change:transform}
      #splash .logo svg{display:block;width:100%;height:auto}
      @media (prefers-reduced-motion:no-preference){#splash .logo{animation:in .5s ease-out both}@keyframes in{from{opacity:0;transform:scale(.96)}}}
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><div class="logo"><!--LOGO--></div></div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
